[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qqp"
version = "1.0.0"
description = "Duplicate question detection on Quora Question Pairs: TF-IDF, Siamese LSTMs and Sentence-BERT compared under one protocol."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "datasets>=2.19",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
qqp = "qqp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
