split_seed: 42                 # fixes the train / tune partition for every run
seeds: [42, 43, 44, 45, 46]    # one training run per seed; the first is the model that is saved
artifacts_dir: artifacts
results_dir: results

data:
  dataset: nyu-mll/glue
  subset: qqp
  tune_fraction: 0.05   # share of the training set held out for early stopping and thresholds
  subsample: null       # number of training pairs to use; null = all

tfidf:
  ngram_max: 2
  min_df: 2
  sublinear_tf: true

rnn:
  max_vocab: 50000
  min_freq: 2
  max_len: 30
  embedding_dim: 200
  hidden_dim: 128
  dropout: 0.3
  pooling: max          # max over hidden states, or "last" for the final hidden state
  lr: 0.001
  lr_decay: 0.5         # factor applied when tuning loss does not improve
  batch_size: 512
  epochs: 15
  patience: 3

sbert:
  # Trained on SNLI + MultiNLI, not on Quora Question Pairs (no benchmark leakage).
  model_name: sentence-transformers/nli-distilroberta-base-v2
  max_seq_length: 64
  batch_size: 64
  eval_batch_size: 256
  lr: 0.00002
  epochs: 3
  margin: 0.5
  warmup_fraction: 0.1
  eval_every: 1000      # steps between tuning-split evaluations
